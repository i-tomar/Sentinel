[project]
name = "sentinel"
version = "0.1.0"
description = "Guarded agentic RAG over Notion, Jira and Gmail via MCP, with a CI-gated eval suite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Ishan Singh Tomar" }]
dependencies = [
    "anyio==4.16.0",
    "fastembed==0.9.1",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "qdrant-client==1.20.0",
    "typer==0.27.3",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel", "servers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", ".", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "PT",  # pytest style
    "S",   # bandit (security)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src,."
files = ["src", "servers", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "unit: fast, isolated tests with no I/O beyond tmp_path",
    "integration: tests that talk to MCP servers (in-process or subprocess) or run the graph",
]
