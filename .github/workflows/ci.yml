name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never sees real credentials: mock LLM, fixture data, tracing off.
  LLM_PROVIDER: mock
  DATA_MODE: fixture
  TRACING_BACKEND: none

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Fixture data is up to date
        run: uv run python -m servers.fixtures.generate --check
      - run: uv run pytest

  eval-fast:
    # Deterministic eval subset: mock LLM, in-process fixture servers, temporary stores.
    # The run itself refuses public network connections; only `uv sync` downloads packages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Eval (fast subset, mock LLM)
        # evals/baselines/mock-fast.json is approved. A missing, unreadable, unapproved or
        # edited baseline fails this required check, as do hard rules (unapproved writes, PII
        # leaks, hallucinated citations), threshold regressions and cases that cannot run.
        # The mock baseline omits latency; mean tool calls stay gated.
        run: make eval-fast
      - name: Job summary (mock LLM)
        if: always()
        run: |
          if [ -f reports/report.md ]; then
            cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### The eval did not produce a report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: eval-fast-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
